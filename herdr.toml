# Reference: https://herdr.dev/docs/config-reference/
# Apply changes with `herdr server reload-config`.
onboarding = false

[keys]
# Default prefix is ctrl+b.
prefix = "ctrl+a"

# Defaults are prefix+v (vertical) and prefix+minus (horizontal).
split_vertical = "prefix+|"
split_horizontal = "prefix+-"

zoom = "prefix+z"

[ui]
mouse_capture = true
copy_on_select = true

# Default "auto" only draws borders around split panes; pane_gaps matches the default.
pane_borders = true
pane_gaps = true

# Default false: label split-pane borders with the agent name.
show_agent_labels_on_pane_borders = true
# Default "dots": use distinct symbols per agent state.
status_indicators = "symbols"
# Default "spaces": order the agent sidebar by priority.
agent_panel_sort = "priority"

[theme]
name = "solarized"
auto_switch = false

[ui.toast]
delivery = "herdr"

# Default rows: [state_icon, workspace], [branch, git_status]; adds colors and bold.
[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "workspace", fg = "#00e5ff", bold = true }],
  [{ token = "branch", fg = "#ff2fb0", bold = true }, "git_status"]
]

# Default rows: [state_icon, machine, workspace, tab], [agent]; shows the terminal title instead, with colors.
[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", { token = "tab", fg = "#ffcc00", bold = true }],
  [{ token = "terminal_title_stripped", fg = "#00afff", bold = true }]
]

# Both unset by default. active_row_bg: current workspace/focused agent row; selection_bg: Navigate-mode cursor row.
[theme.custom]
active_row_bg = "#2a3448"
selection_bg = "#242830"
