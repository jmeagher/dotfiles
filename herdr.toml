onboarding = false

[keys]
prefix = "ctrl+a"

split_vertical = "prefix+|"
split_horizontal = "prefix+-"

zoom = "prefix+z"

[ui]
mouse_capture = true
copy_on_select = true

pane_borders = true
pane_gaps = true

show_agent_labels_on_pane_borders = true
status_indicators = "symbols"
agent_panel_sort = "priority"

[theme]
name = "solarized"
auto_switch = false

[ui.toast]
delivery = "herdr"

[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "workspace", fg = "#00e5ff", bold = true }],
  [{ token = "branch", fg = "#ff2fb0", bold = true }, "git_status"]
]

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", { token = "tab", fg = "#ffcc00", bold = true }],
  [{ token = "terminal_title_stripped", fg = "#00afff", bold = true }]
]

# active_row_bg marks the current workspace and focused agent: a clearly
# lighter, blue-tinted dark grey so "current" stands out at a glance.
# selection_bg is the Navigate-mode cursor row and stays darker/subtler.
[theme.custom]
active_row_bg = "#2a3448"
selection_bg = "#242830"
